<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历优化与求职信生成器</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <h1>📝 简历优化与求职信生成器</h1>
            <div class="model-badge" id="modelBadge">
                <span class="dot"></span> 等待调用...
            </div>
            <p class="guide">输入个人经历或修改建议，AI 将基于上下文持续优化。支持多轮对话，密钥仅本地内存暂存。</p>
        </header>

        <main class="app-main">
            <div class="input-panel">
                <label for="apiKey">🔑 阿里云百炼 API Key</label>
                <input type="password" id="apiKey" placeholder="粘贴 Key（仅运行时使用，刷新清除）">
                
                <textarea id="userInput" placeholder="例如：我熟悉 Python 与 Django，有 2 年后端经验，目标岗位 AI 算法工程师，请写一段项目经历亮点..."></textarea>
                
                <div class="btn-group">
                    <button id="sendBtn">✨ 生成 / 继续修改</button>
                    <button id="clearBtn" class="secondary">🔄 重新开始</button>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-box" id="chatBox">
                    <div class="message assistant system-hint">
                        💡 提示：首次对话请提供背景信息；生成后可直接输入“更简短”“换风格”“侧重某技能”继续修改。
                    </div>
                </div>
                <div id="responseMeta" class="meta-box" style="display:none;"></div>
            </div>
            <p id="errorMsg" class="error-msg"></p>
        </main>

        <footer class="app-footer">
            基于阿里云百炼 OpenAI 兼容接口 | 纯前端静态应用 | 不收集、不上传任何密钥与隐私数据
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
